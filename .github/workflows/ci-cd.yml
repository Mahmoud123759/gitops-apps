name: Build diff versions of the app and push to ECR

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"  
  workflow_dispatch:
       
permissions:
  id-token: write
  contents: read

env:
  AWS_ROLE_ARN: arn:aws:iam::345259854056:role/github-actions-ecr-role
  AWS_REGION: us-east-1
  APP_DIR: app/v1
  APP_VERSION: v1.0.0
 
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # forks can't get OIDC credentials, so they only build
      CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: env.CAN_PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        if: env.CAN_PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ env.APP_VERSION }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ env.APP_DIR }}
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ vars.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
