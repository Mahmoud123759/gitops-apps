apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: frontend-demo
  namespace: frontend-demo
spec:
  replicas: 4
  revisionHistoryLimit: 3
  strategy:
    canary:
      canaryService: frontend-demo-canary
      stableService: frontend-demo-stable
      trafficRouting:
        alb:
          ingress: frontend-demo-ingress
          servicePort: 80
      steps:
        - setWeight: 10
        - pause: {duration: 20}
        - analysis:
            templates:
              - templateName: frontend-canary-analysis
        - setWeight: 25
        - pause: {duration: 20}
        - setWeight: 50
        - pause: {duration: 20}
        - setWeight: 75
        - pause: {duration: 30}
        - setWeight: 100
  selector:
    matchLabels:
      app: frontend-demo
  template:
    metadata:
      labels:
        app: frontend-demo
    spec:
      containers:
        - name: frontend-demo
          image: 345259854056.dkr.ecr.us-east-1.amazonaws.com/app-v2:latest
          ports:
            - containerPort: 3000
          # env:
          #   - name: APP_VERSION
          #     value: "v1"
          #   - name: APP_COLOR
          #     value: "#2563eb"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi